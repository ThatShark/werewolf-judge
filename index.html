    <!-- GitHub Pages SPA 404 重導向參數還原 -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('spa_redirect');
        if (redirect) {
          params.delete('spa_redirect');
          var base = window.location.pathname.replace(/\/$/, '');
          var cleanTarget = redirect.startsWith('/') ? redirect : '/' + redirect;
          var nextUrl = base + cleanTarget;
          try {
            window.history.replaceState(null, '', nextUrl);
          } catch (e) {
            // 忽略不支援 history.replaceState 的環境
          }
        }
      })();
    </script>

          <li>內建夜間流程提詞機、自動規則防呆（同守同救奶穿、連環開槍、單／雙爆吞警徽）、白天雙模式投票紀錄器、發言計時與一鍵復盤戰報匯出。</li>
